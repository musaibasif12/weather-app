<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Weather App</h1>
    <div class="input-box">
        <form onsubmit="wheather(event)">
            <input type="text" id="input-value" required>
            <button>Check Weather</button>
        </form>
        <table>
            <tr>
                <td id="temp">Temp</td>
                <td id="temp-value"></td>
            </tr>
            <tr>
                <td id="humidity">Humidity</td>
                <td id="humi-value"></td>
            </tr>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.17.0/dist/axios.min.js"></script>
    <script src="./app.js"></script>
</body>
</html>
